name: customer_app_car_rental
description: "A new Flutter project."
publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ============================================================
  # ROUTING / STATE
  # ============================================================

  go_router: ^17.5.0
  flutter_riverpod: ^3.3.2

  # ============================================================
  # NETWORK / STORAGE
  # ============================================================

  dio: ^5.11.1
  shared_preferences: ^2.5.5

  # ============================================================
  # UI / FONTS
  # ============================================================

  google_fonts: ^8.2.1
  cached_network_image: ^3.4.1
  intl: ^0.20.3

  # ============================================================
  # FIREBASE
  # Keep these versions aligned.
  # ============================================================

  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  firebase_messaging: ^16.7.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.6.0
  cloud_functions: ^6.5.0

  # ============================================================
  # PAYMENTS
  # ============================================================

  razorpay_flutter: ^1.4.1

  # ============================================================
  # UI / ANIMATION
  # ============================================================

  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  lottie: ^3.3.3

  # ============================================================
  # DEVICE / NETWORK
  # ============================================================

  url_launcher: ^6.3.2
  http: ^1.5.0
  device_info_plus: ^12.1.0

  # ============================================================
  # MEDIA
  # ============================================================

  image_picker: ^1.2.3

  # ============================================================
  # PDF / PRINTING
  # ============================================================

  pdf: ^3.11.3
  printing: ^5.14.2

  # ============================================================
  # SHARING
  # ============================================================

  share_plus: any

  # ============================================================
  # LOCAL NOTIFICATIONS
  # ============================================================

  flutter_local_notifications: ^22.3.1


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # ============================================================
  # APP ICON GENERATOR
  # ============================================================

  flutter_launcher_icons: ^0.14.4


flutter:
  uses-material-design: true

  # ============================================================
  # ASSETS
  # ============================================================

  assets:
    - assets/icons/rentocar_icon.png


# ============================================================
# RENTOCAR APP ICON
# ============================================================

# ============================================================
# RENTOCAR APP ICON
# ============================================================

flutter_launcher_icons:
  android: true
  ios: true

  # Main source icon
  image_path: "assets/icons/rentocar_icon.png"

  # ============================================================
  # ANDROID
  # ============================================================

  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/rentocar_icon.png"

  # ============================================================
  # IOS
  # ============================================================

  # Apple requires the large App Store icon to have
  # no transparency / alpha channel.
  remove_alpha_ios: true

  # ============================================================
  # ANDROID MIN SDK
  # ============================================================

  min_sdk_android: 21