
name: customer_app_car_rental
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^17.5.0
  flutter_riverpod: ^3.3.2
  dio: ^5.11.1
  shared_preferences: ^2.5.5
  google_fonts: ^8.2.1
  cached_network_image: ^3.4.1
  intl: ^0.20.3

  # Firebase
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  firebase_messaging: ^16.6.0
  cloud_firestore: ^6.9.0
  firebase_storage: ^13.5.0
  cloud_functions: ^6.5.0

  # UI / Animation
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  lottie: ^3.3.3

  # Device / Network
  url_launcher: ^6.3.2
  http: ^1.5.0
  device_info_plus: ^12.1.0

  # Media
  image_picker: ^1.2.3

  # PDF / Printing
  pdf: ^3.11.3
  printing: ^5.14.2

  # Sharing
  share_plus: any

  # Notifications
  flutter_local_notifications: ^22.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # App launcher icon generator
  flutter_launcher_icons: ^0.14.4

flutter:

  uses-material-design: true

  assets:
    - assets/icons/rentocar_icon.png


# ============================================================
# RENTOCAR APP ICON
# ============================================================

flutter_launcher_icons:
  android: true
  ios: true

  # Main source icon
  image_path: "assets/icons/rentocar_icon.png"

  # Android
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/rentocar_icon.png"

  # iOS
  remove_alpha_ios: false

  # Prevent automatic legacy Android icon scaling
  min_sdk_android: 21

